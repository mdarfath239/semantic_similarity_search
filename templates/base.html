<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Semantic Search{% endblock %} — SemanticSearch AI</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />

  <!-- Font Awesome 6 -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- App stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2.0" />

  {% block head %}{% endblock %}
</head>
<body>

  <!-- ===== NAVIGATION ===== -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom sticky-top">
    <div class="container">

      <!-- Brand -->
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="brand-icon">
          <i class="fa-solid fa-magnifying-glass-chart"></i>
        </div>
        <span class="brand-name">SemanticSearch <span class="text-primary">AI</span></span>
      </a>

      <!-- Mobile toggle -->
      <button
        class="navbar-toggler border-0"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Links -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'main.index' %}active{% endif %}" href="/">
              <i class="fa-solid fa-house me-1"></i>Search
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'main.about' %}active{% endif %}" href="/about">
              <i class="fa-solid fa-circle-info me-1"></i>About
            </a>
          </li>
          <li class="nav-item ms-lg-2">
            <span id="nav-status-badge" class="badge badge-status badge-loading">
              <i class="fa-solid fa-circle-notch fa-spin me-1"></i>Checking…
            </span>
          </li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer border-top bg-white mt-auto py-4">
    <div class="container">
      <div class="row align-items-center gy-2">
        <div class="col-md-6 text-center text-md-start">
          <span class="text-muted small">
            <i class="fa-solid fa-magnifying-glass-chart me-1 text-primary"></i>
            <strong>SemanticSearch AI</strong> — Word2Vec Semantic Document Search
          </span>
        </div>
        <div class="col-md-6 text-center text-md-end">
          <span class="text-muted small">
            Dataset: 20 Newsgroups &nbsp;·&nbsp; 18 227 documents &nbsp;·&nbsp; 100-dim embeddings
          </span>
        </div>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    crossorigin="anonymous"
  ></script>

  <!-- App JS -->
  <script src="{{ url_for('static', filename='js/app.js') }}?v=2.0"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
